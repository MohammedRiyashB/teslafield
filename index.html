<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101014"><meta name="description" content="TESLAFIELD — your AI conversation workspace."><title>TESLAFIELD — AI workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"></head>
<body><div class="app"><div class="scrim" id="scrim"></div><aside class="sidebar" id="sidebar"><div class="side-head"><a class="brand" href="#"><span class="brand-mark">T</span><span>TESLAFIELD</span></a><button class="icon-btn collapse-btn" id="closeSidebar" aria-label="Close sidebar">×</button></div><button class="new-chat" id="newChat"><span>＋</span> New chat <kbd>⌘ K</kbd></button><div class="side-label">WORKSPACE</div><button class="side-link active"><span>◈</span> Chat</button><button class="side-link" id="imageNav"><span>▧</span> Image studio <small>SOON</small></button><button class="side-link" id="videoNav"><span>▷</span> Video studio <small>SOON</small></button><div class="history-head"><span class="side-label">RECENT</span><button id="clearHistory" class="text-btn">Clear</button></div><div class="history-list" id="historyList"></div><div class="side-bottom"><button class="side-link" id="themeToggle"><span>◐</span> Switch appearance</button><div class="account"><div class="account-avatar">T</div><div><strong>TESLAFIELD user</strong><small>Free workspace</small></div><span class="more">•••</span></div></div></aside>
<main class="main"><header class="topbar"><button class="icon-btn mobile-menu" id="openSidebar" aria-label="Open sidebar">☰</button><div class="model-select"><span class="brand-mini">T</span><strong>TESLAFIELD</strong><span class="model-tag">AI</span><span class="chevron">⌄</span></div><div class="top-actions"><span class="connection" id="connection"><i></i> Connecting</span><button class="icon-btn" id="shareBtn" aria-label="Share chat">↗</button></div></header><section class="conversation" id="conversation"><div class="welcome" id="welcome"><div class="welcome-mark">T</div><p class="eyebrow">YOUR AI WORKSPACE</p><h1>What can I help you with?</h1><p class="welcome-sub">Ask anything. Explore ideas. Make progress.</p><div class="suggestions"><button class="suggestion" data-prompt="Explain a complex topic in simple words."><span>✳</span><strong>Explain something</strong><small>Make a difficult topic easy to understand</small></button><button class="suggestion" data-prompt="Help me write a clear, professional email."><span>✎</span><strong>Write anything</strong><small>Draft, rewrite, and polish your words</small></button><button class="suggestion" data-prompt="Help me brainstorm creative ideas for a new project."><span>✧</span><strong>Brainstorm ideas</strong><small>Explore possibilities and new directions</small></button><button class="suggestion" data-prompt="Help me debug this code step by step."><span>⌘</span><strong>Code with me</strong><small>Build, debug, and understand code</small></button></div></div><div class="messages" id="messages" aria-live="polite"></div></section><div class="composer-wrap"><form class="composer" id="composer"><textarea id="prompt" rows="1" maxlength="12000" placeholder="Message TESLAFIELD..." aria-label="Message TESLAFIELD"></textarea><div class="composer-bottom"><div class="composer-tools"><button type="button" class="tool-btn" id="attachBtn" aria-label="Attach file">＋</button><span class="tool-hint">AI chat</span></div><div class="send-tools"><span class="model-hint">Standard</span><button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">↑</button></div></div></form><p class="disclaimer">TESLAFIELD can make mistakes. Check important information.</p></div><input id="fileInput" type="file" hidden multiple accept="image/*,.pdf,.txt,.doc,.docx"></main></div><div class="toast" id="toast" role="status"></div><script src="./app.js" defer></script></body></html>
