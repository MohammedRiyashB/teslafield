name: Deploy TESLAFIELD Chat Engine to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "chat-engine/**"
      - ".github/workflows/sync-chat-engine-to-huggingface.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslafield-chat-engine-huggingface
  cancel-in-progress: false

jobs:
  sync-chat-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TESLAFIELD
        uses: actions/checkout@v4

      - name: Validate chat engine source
        run: |
          python -m py_compile chat-engine/app.py
          test -s chat-engine/Dockerfile
          test -s chat-engine/requirements.txt
          grep -q "Qwen3-1.7B-Q4_K_M.gguf" chat-engine/app.py
          grep -q '"/chat"' chat-engine/app.py
          grep -q '"/stream"' chat-engine/app.py
          grep -q '"/health"' chat-engine/app.py
          grep -q '"/info"' chat-engine/app.py
          echo "TESLAFIELD Qwen3-1.7B source validation passed."

      - name: Sync Chat Engine to its existing Hugging Face Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Earthaioa/EARTH_OS_V10_DOCKER
          subdirectory: chat-engine
          space_sdk: docker
          hf_token: ${{ secrets.HF_TOKEN }}
