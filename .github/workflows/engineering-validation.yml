name: TeslafieldAI engineering validation

on:
  push:
    branches:
      - "engineering/**"
    paths:
      - "app.js"
      - "oauth.js"
      - "sw.js"
      - "firestore.rules"
      - "backend/**"
      - "huggingface/chat-space/**"
      - "huggingface/speech-space/**"
      - "huggingface/voice-space/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app.js"
      - "oauth.js"
      - "sw.js"
      - "backend/**"
      - "huggingface/chat-space/**"
      - "huggingface/speech-space/**"
      - "huggingface/voice-space/**"
      - ".github/workflows/engineering-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslafieldai-engineering-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check backend dependency vulnerabilities
        run: |
          npm install --package-lock-only --ignore-scripts --prefix backend
          npm audit --prefix backend --audit-level=high

      - name: Check JavaScript and Python syntax
        run: |
          node --check app.js
          node --check oauth.js
          node --check backend/server.js
          node --check backend/idempotency.js
          node --check backend/openrouter.js
          node --check backend/conversation-store.js
          node --check backend/shared-response-store.js
          node --check backend/oauth-mcp.js
          node --check sw.js
          node --check backend/test/live-security-smoke.js
          python -m py_compile huggingface/chat-space/app.py huggingface/chat-space/response_style.py huggingface/speech-space/app.py huggingface/voice-space/app.py
          PYTHONPATH=huggingface/chat-space python -m unittest discover -s huggingface/chat-space/tests -v

      - name: Run backend API regression tests
        run: npm test --prefix backend
