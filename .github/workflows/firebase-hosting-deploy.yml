name: Deploy TeslafieldAI to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "oauth.html"
      - "oauth.css"
      - "oauth.js"
      - "terms.html"
      - "privacy.html"
      - "chatgpt-privacy.html"
      - "chatgpt-terms.html"
      - "styles.css"
      - "app.js"
      - "backend/**"
      - "theme-init.js"
      - "assets/**"
      - "teslafieldai-logo.png"
      - "manifest.webmanifest"
      - "sw.js"
      - "teslafield-pwa-icon.svg"
      - "teslafield-icon-192.png"
      - "teslafield-icon-512.png"
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslafield-firebase-hosting-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate frontend and backend JavaScript
        run: |
          node --check app.js
          node --check oauth.js
          node --check backend/oauth-mcp.js
          node --check backend/server.js
          node --test backend/test/*.test.js
          node --check sw.js
          python -m py_compile huggingface/chat-space/app.py
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          assert.match(html, /^<body class="auth-pending" aria-busy="true">/m, "The app must start behind the Firebase auth gate");
          assert.ok(html.includes("Loading TeslafieldAI..."), "A neutral loading screen must cover the app during auth restore");
          assert.match(html, /href="\/styles\.css\?v=/);
          assert.match(html, /src="\/app\.js\?v=/);
          assert.match(html, /src="\/theme-init\.js\?v=/);
          const app = fs.readFileSync('app.js', 'utf8');
          const backend = fs.readFileSync('backend/server.js', 'utf8');
          const oauthPage = fs.readFileSync('oauth.html', 'utf8');
          const oauthCss = fs.readFileSync('oauth.css', 'utf8');
          const hostingConfig = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const csp = hostingConfig.hosting.headers.find((entry) => entry.source === '**').headers.find((entry) => entry.key === 'Content-Security-Policy').value;
          assert.ok(!csp.includes("'unsafe-inline'") && !csp.includes('https:;') && !csp.includes('https://*.'), 'CSP must not permit unsafe inline styles or broad HTTPS wildcards');
          assert.ok(!/<style\\b|\\sstyle\\s*=/.test(oauthPage), 'OAuth page must not use inline styles');
          assert.ok(oauthCss.includes('.primary{'), 'OAuth page external stylesheet must exist');
          assert.ok(!app.includes('.style.') && !app.includes('visual-viewport-height'), 'Frontend must not mutate inline styles');
          assert.ok(fs.readFileSync('styles.css', 'utf8').includes('field-sizing:content'), 'Composer textarea must use CSS-native content sizing');
          const oauthClient = fs.readFileSync('oauth.js', 'utf8');
          const mcpBridge = fs.readFileSync('backend/oauth-mcp.js', 'utf8');
          assert.match(html, /id="historySearch"/);
          assert.match(html, /class="composer-model-row" aria-label="Choose AI model" hidden/);
          assert.match(html, /id="attachmentButton" type="button" hidden/);
          assert.ok(app.includes("modelSelectorRow.hidden = !signedIn"), "Model picker must follow Firebase sign-in state");
          assert.ok(app.includes("attachmentControl.hidden = !signedIn"), "Attachment control must follow Firebase sign-in state");
          assert.match(fs.readFileSync("styles.css", "utf8"), /body\.signed-in \.composer-model-row\s*\{\s*margin-bottom:\s*19px !important;/);
          const uiCss = fs.readFileSync("styles.css", "utf8");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .topbar .icon-button") && uiCss.includes("--tf-control-bg:"), "Signed-in top controls must use the refined grey palette");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .connect-entry-button") && uiCss.includes("color:var(--tf-control-text)!important"), "CONNECTO must use the visible grey control palette");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .composer-model-row .model-picker-button") && uiCss.includes("background:var(--tf-control-bg)!important"), "Model selector must use the grey capsule palette");
          assert.ok(uiCss.includes(".message-row.user .message-content") && uiCss.includes("background:var(--surface-2)!important"), "User messages must use theme-aware ChatGPT-style bubbles");
          assert.ok(app.includes('document.body.classList.toggle("sidebar-collapsed")'), "Desktop menu must toggle the sidebar");
          assert.ok(uiCss.includes(".composer-shell") && uiCss.includes("max-width:768px!important"), "Composer must use a centered ChatGPT-style width");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .conversation-scroll") && uiCss.includes("overflow-y:auto!important"), "Signed-in messages must remain the scrolling layer");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .topbar") && uiCss.includes("pointer-events:none!important"), "Top controls must float over the conversation");
          assert.ok(uiCss.includes("border-radius:50%!important") && uiCss.includes("body.signed-in:not(.guest-mode) .connect-entry-button"), "Menu and CONNECTO controls must be circular");
          assert.ok(uiCss.includes("border-radius:999px!important") && uiCss.includes("composer-model-row .model-picker-button"), "Floating model selector must be a capsule");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .composer-area") && uiCss.includes("inset:auto 0 0 0!important"), "Composer must be fixed as a floating bottom dock");
          assert.ok(uiCss.includes("backdrop-filter:blur(22px) saturate(150%)!important"), "Composer must have a translucent glass surface");
          assert.ok(uiCss.includes("body.signed-in:not(.guest-mode) .guest-legal{display:none!important}"), "No extra footer line should appear below the signed-in dock");
          assert.ok(uiCss.includes("scrollbar-width:none!important"), "All browser scrollbars must be hidden without disabling scrolling");
          assert.ok(uiCss.includes("*::-webkit-scrollbar") && uiCss.includes("display:none!important"), "WebKit scrollbars must be fully hidden on every edge");
          assert.ok(uiCss.includes("scrollbar-gutter:auto!important"), "No reserved scrollbar gutter should remain");
          assert.match(html, /id="personalizeModal"/);
          assert.ok(app.includes('/api/v1/chat/completions'), 'Frontend must call the complete-response model endpoint');
          assert.ok(!app.includes('/api/v1/chat/stream'), 'Frontend must not render token-by-token streaming');
          assert.ok(app.includes('Thinking…'), 'Chat must show a thinking-only indicator');
          assert.ok(app.includes('async function transcribeVoiceRecording'));
          assert.ok(app.includes('/api/v1/speech/transcribe'));
          assert.ok(app.includes('new MediaRecorder'));
          assert.ok(html.includes('id="micButton"'), 'Composer microphone button must exist');
          assert.ok(!app.includes('followup-suggestions'));
          assert.ok(app.includes('response_style: userPreferences.responseStyle'));
          const authInitStart = app.indexOf('async function initializeFirebaseAuth()');
          const authInitEnd = app.indexOf('async function requireAuthentication', authInitStart);
          assert.ok(authInitStart >= 0 && authInitEnd > authInitStart, 'Firebase auth initializer must exist');
          const authInit = app.slice(authInitStart, authInitEnd);
          assert.ok(authInit.includes('Auth.Persistence.LOCAL'), 'LOCAL persistence should be preferred');
          assert.ok(authInit.includes('Auth.Persistence.SESSION'), 'SESSION persistence fallback is required');
          assert.ok(authInit.includes('Auth.Persistence.NONE'), 'memory persistence fallback is required');
          assert.ok(authInit.indexOf('onAuthStateChanged') >= 0);
          assert.ok(authInit.indexOf('onAuthStateChanged') < authInit.indexOf('await authClient.setPersistence'), 'Attach the auth observer before persistence work');
          assert.ok(authInit.includes('initialAuthStateReceived') && authInit.includes('redirectResultProcessed'), 'Wait for initial auth and redirect restoration before revealing the app');
          assert.ok(app.includes('function markAuthReady()') && app.includes('classList.remove("auth-pending")'), 'Only reveal the app after auth state is resolved');
          assert.ok(fs.readFileSync("styles.css", "utf8").includes("body.auth-pending .app-shell{visibility:hidden!important}"), 'Hide the app shell until Firebase auth is resolved');
          assert.ok(authInit.indexOf('getRedirectResult') > authInit.indexOf('onAuthStateChanged'), 'Attach auth observer before reading redirect result');
          const signInStart = app.indexOf('async function accountEntry()');
          const signInEnd = app.indexOf('async function deleteAccountAndLocalData', signInStart);
          assert.ok(signInStart >= 0 && signInEnd > signInStart, 'Google sign-in entry handler must exist');
          const signIn = app.slice(signInStart, signInEnd);
          assert.ok(signIn.includes('signInWithPopup'), 'Google popup sign-in must be available');
          assert.ok(signIn.includes('signInWithRedirect'), 'Google redirect recovery must be available');
          assert.ok(app.includes('welcome.hidden = !!(chat && chat.messages.length);'), 'Empty signed-in chats must show the chat entry screen');
          assert.ok(!app.includes('chatWorkspaceActive'), 'Do not hide the starter screen solely because a user signed in');
          assert.match(html, /id="installExperienceBanner"/);
          assert.ok(app.includes('installBannerCooldown = 5 * 60 * 1000'));
          assert.ok(app.includes('beforeinstallprompt'));
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          assert.equal(manifest.id, '/');
          assert.equal(manifest.display, 'standalone');
          assert.ok(manifest.icons.some(icon => icon.src === '/teslafield-icon-192.png' && icon.sizes === '192x192'));
          assert.ok(manifest.icons.some(icon => icon.src === '/teslafield-icon-512.png' && icon.sizes === '512x512'));
          assert.ok(manifest.icons.some(icon => icon.src === '/teslafield-pwa-icon.svg'));
          assert.ok(fs.readFileSync('sw.js', 'utf8').includes('teslafield-pwa-shell-v14'));
          assert.ok(fs.readFileSync('theme-init.js', 'utf8').includes('teslafield.appearance.v2'));
          const chatEngine = fs.readFileSync('huggingface/chat-space/app.py', 'utf8');
          assert.ok(chatEngine.includes('MODEL_ID = "Qwen/Qwen3-0.6B"'));
          assert.ok(chatEngine.includes('TextIteratorStreamer'));
          assert.ok(chatEngine.includes('StreamingResponse'));
          assert.ok(!chatEngine.includes('llama_cpp'));
          assert.ok(backend.includes('CHAT_SPACE_URL + "/stream"'));
          assert.ok(backend.includes('["/api/v1/chat/stream", "chat"]'));
          assert.ok(backend.includes('url.pathname === "/api/v1/chat/completions"'));
          assert.ok(backend.includes('require("./oauth-mcp")'), 'API must load the OAuth/MCP bridge');
          assert.ok(mcpBridge.includes('code_challenge_methods_supported: ["S256"]'));
          assert.ok(mcpBridge.includes('client_id_metadata_document_supported: true'));
          assert.ok(mcpBridge.includes('ask_teslafield'));
          assert.ok(mcpBridge.includes('Qwen/Qwen3-0.6B'));
          assert.ok(oauthPage.includes('/__/firebase/init.js'));
          assert.ok(oauthPage.includes('src="/oauth.js?v='));
          assert.ok(oauthClient.includes('/oauth/consent'));
          assert.ok(oauthClient.includes('signInWithPopup'));
          assert.ok(backend.includes('url.pathname === "/api/v1/speech/transcribe"'));
          assert.ok(backend.includes('transcribeWithSpace(encoded, input.mimeType, input.language)'));
          assert.match(html, /<div class="composer-toolbar">\s*<div class="composer-tools">[\s\S]*?<span class="composer-hint">Ask anything<\/span>\s*<\/div>\s*<div class="composer-actions">[\s\S]*?<button class="send-button"/);
          console.log('Frontend structure checks passed: absolute assets and one aligned composer toolbar.');
          NODE
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const zlib = require('node:zlib');
          const sample = { content: '# TESLAFIELD share test\n\nTamil: வணக்கம் — exact response.\n\n- first\n- second' };
          const json = Buffer.from(JSON.stringify(sample), 'utf8');
          const payloads = [
            'j' + json.toString('base64url'),
            'g' + zlib.gzipSync(json).toString('base64url')
          ];
          for (const payload of payloads) {
            const url = new URL('https://teslafieldai.web.app/share/123456789012345678?data=' + encodeURIComponent(payload));
            const restoredPayload = url.searchParams.get('data');
            const bytes = restoredPayload[0] === 'g'
              ? zlib.gunzipSync(Buffer.from(restoredPayload.slice(1), 'base64url'))
              : Buffer.from(restoredPayload.slice(1), 'base64url');
            assert.deepEqual(JSON.parse(bytes.toString('utf8')), sample);
          }
          console.log('Share-link round-trip checks passed: UTF-8, query URL, plain and gzip payloads.');
          NODE

      - name: Backend security smoke tests
        run: |
          set -euo pipefail
          PORT=18765 CORS_ORIGIN="https://teslafieldai.web.app" FIREBASE_PROJECT_ID="teslafieldai" PUBLIC_BASE_URL="https://teslafield-api.onrender.com" TESLAFIELD_OAUTH_SECRET="ci-only-secret-value-with-more-than-32-characters" node backend/server.js >/tmp/teslafield-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl --fail --silent http://127.0.0.1:18765/health | grep -q '"ok":true'
          curl --silent --show-error -D /tmp/teslafield-cors-allowed.headers -o /dev/null -H "Origin: https://teslafieldai.web.app" http://127.0.0.1:18765/health
          grep -qi '^access-control-allow-origin: https://teslafieldai.web.app' /tmp/teslafield-cors-allowed.headers
          denied="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Origin: https://attacker.invalid" http://127.0.0.1:18765/health)"
          test "$denied" = "403"
          unauthorized="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Content-Type: application/json" --data '{"messages":[{"role":"user","content":"test"}]}' http://127.0.0.1:18765/api/v1/chat/completions)"
          test "$unauthorized" = "401"
          unauthorized_stream="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Content-Type: application/json" --data '{"messages":[{"role":"user","content":"test"}]}' http://127.0.0.1:18765/api/v1/chat/stream)"
          test "$unauthorized_stream" = "401"
          for attempt in $(seq 3 20); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Content-Type: application/json" --data '{"messages":[{"role":"user","content":"test"}]}' http://127.0.0.1:18765/api/v1/chat/completions)"
            test "$status" = "401"
          done
          limited="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Content-Type: application/json" --data '{"messages":[{"role":"user","content":"test"}]}' http://127.0.0.1:18765/api/v1/chat/completions)"
          test "$limited" = "429"
          echo "Backend security checks passed: health, strict CORS, auth required and rate limiting."
          curl --fail --silent --show-error http://127.0.0.1:18765/.well-known/oauth-protected-resource | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(x.resource!=='https://teslafield-api.onrender.com/mcp'||!x.authorization_servers.includes('https://teslafield-api.onrender.com')||!x.scopes_supported.includes('teslafield:chat'))process.exit(1)})"
          curl --fail --silent --show-error http://127.0.0.1:18765/.well-known/oauth-authorization-server | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.code_challenge_methods_supported.includes('S256')||!x.client_id_metadata_document_supported||x.token_endpoint_auth_methods_supported[0]!=='none')process.exit(1)})"
          mcp_unauthorized="$(curl --silent --show-error -D /tmp/teslafield-mcp.headers -o /tmp/teslafield-mcp.json --write-out '%{http_code}' -X POST -H "Accept: application/json, text/event-stream" -H "Content-Type: application/json" --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' http://127.0.0.1:18765/mcp)"
          test "$mcp_unauthorized" = "401"
          grep -Eqi 'resource_metadata="?https://teslafield-api.onrender.com/\.well-known/oauth-protected-resource"?' /tmp/teslafield-mcp.headers
          echo "MCP and OAuth discovery checks passed: resource metadata, issuer metadata, PKCE and protected MCP endpoint."

      - name: Prepare Firebase Hosting files
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html oauth.html oauth.js styles.css app.js theme-init.js terms.html privacy.html chatgpt-privacy.html chatgpt-terms.html public/
          cp manifest.webmanifest sw.js teslafield-pwa-icon.svg teslafield-icon-192.png teslafield-icon-512.png public/
          test -s teslafieldai-logo.png
          cp teslafieldai-logo.png public/
          if [ -d assets ]; then cp -R assets public/assets; fi
          if [ -f favicon.ico ]; then cp favicon.ico public/; fi
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest public/; fi
          if [ -f sw.js ]; then cp sw.js public/; fi
          test -s public/index.html
          test -s public/oauth.html
          test -s public/oauth.js
          test -s public/styles.css
          test -s public/app.js
          test -s public/theme-init.js
          test -s public/terms.html
          test -s public/privacy.html
          test -s public/chatgpt-privacy.html
          test -s public/chatgpt-terms.html
          test -s public/teslafieldai-logo.png
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/teslafield-pwa-icon.svg
          test -s public/teslafield-icon-192.png
          test -s public/teslafield-icon-512.png
          echo "TESLAFIELD static files prepared."

      - name: Deploy Firebase Hosting live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESLAFIELDAI }}
          projectId: teslafieldai
          channelId: live

      - name: Verify published TeslafieldAI UI and assets
        run: |
          set -euo pipefail
          BASE="https://teslafieldai.web.app"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "${BASE}/?verify=${GITHUB_SHA}" -o /tmp/teslafield-home.html
          VERSION="$(sed -n 's/.*styles\.css?v=\([^"]*\).*/\1/p' /tmp/teslafield-home.html | head -n1)"
          test -n "$VERSION"
          grep -q "theme-init.js?v=$VERSION" /tmp/teslafield-home.html
          grep -q "Message Teslafield" /tmp/teslafield-home.html
          curl --fail --silent --show-error "${BASE}/teslafieldai-logo.png?v=$VERSION" -o /tmp/teslafieldai-logo.png
          test -s /tmp/teslafieldai-logo.png
          curl --fail --silent --show-error "${BASE}/manifest.webmanifest" -o /tmp/teslafield-manifest.json
          node -e "const m=JSON.parse(require('node:fs').readFileSync('/tmp/teslafield-manifest.json','utf8')); if(m.id!=='/' || m.display!=='standalone') process.exit(1)"
          curl --fail --silent --show-error "${BASE}/sw.js?verify=${GITHUB_SHA}" -o /tmp/teslafield-sw.js
          LOCAL_CACHE_NAME="$(grep -oE '^const CACHE_NAME = "teslafield-pwa-shell-v[0-9]+";' sw.js | head -n1 | cut -d'"' -f2)"
          REMOTE_CACHE_NAME="$(grep -oE '^const CACHE_NAME = "teslafield-pwa-shell-v[0-9]+";' /tmp/teslafield-sw.js | head -n1 | cut -d'"' -f2)"
          test -n "$LOCAL_CACHE_NAME"
          test "$LOCAL_CACHE_NAME" = "$REMOTE_CACHE_NAME"
          echo "Verified deployed service-worker cache: $REMOTE_CACHE_NAME"
          curl --fail --silent --show-error "${BASE}/teslafield-pwa-icon.svg" -o /tmp/teslafield-icon.svg
          grep -q "<svg" /tmp/teslafield-icon.svg
          curl --fail --silent --show-error "${BASE}/teslafield-icon-192.png" -o /tmp/teslafield-icon-192.png
          curl --fail --silent --show-error "${BASE}/teslafield-icon-512.png" -o /tmp/teslafield-icon-512.png
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [file, size] of [['/tmp/teslafield-icon-192.png', 192], ['/tmp/teslafield-icon-512.png', 512]]) {
            const image = fs.readFileSync(file);
            if (image.readUInt32BE(16) !== size || image.readUInt32BE(20) !== size) throw new Error('Invalid PWA icon dimensions: ' + file);
          }
          console.log('Verified 192px and 512px PNG install icons.');
          NODE
          echo "Verified PWA manifest, service worker and app icon."
          curl --fail --silent --show-error "${BASE}/styles.css?v=$VERSION&verify=${GITHUB_SHA}" -o /tmp/teslafield-styles.css
          grep -q "starter-grid" /tmp/teslafield-styles.css
          curl --fail --silent --show-error "${BASE}/app.js?v=$VERSION&verify=${GITHUB_SHA}" -o /tmp/teslafield-app.js
          grep -q "conversations.v4." /tmp/teslafield-app.js
          grep -q "savePendingGuestPrompt" /tmp/teslafield-app.js
          grep -q "storeCookieChoices" /tmp/teslafield-app.js
          grep -q "Auth.Persistence.SESSION" /tmp/teslafield-app.js
          grep -q "Auth.Persistence.NONE" /tmp/teslafield-app.js
          grep -q "welcome.hidden = !!(chat && chat.messages.length);" /tmp/teslafield-app.js
          grep -q "guest-mode" /tmp/teslafield-styles.css
          grep -q "cookie-banner" /tmp/teslafield-styles.css
          grep -q "body.signed-in .connect-entry-button" /tmp/teslafield-styles.css
          grep -q "background:var(--surface-2)!important" /tmp/teslafield-styles.css
          grep -q "max-width:768px!important" /tmp/teslafield-styles.css
          grep -q "body.signed-in:not(.guest-mode) .conversation-scroll" /tmp/teslafield-styles.css
          grep -q "backdrop-filter:blur(22px) saturate(150%)!important" /tmp/teslafield-styles.css
          grep -q "border-radius:999px!important" /tmp/teslafield-styles.css
          grep -q "inset:auto 0 0 0!important" /tmp/teslafield-styles.css
          grep -q -- "--tf-control-bg:" /tmp/teslafield-styles.css
          grep -q -- "--tf-composer-bg:" /tmp/teslafield-styles.css
          grep -q "background:var(--tf-send-bg)!important" /tmp/teslafield-styles.css
          grep -q 'classList.toggle("sidebar-collapsed")' /tmp/teslafield-app.js
          curl --fail --location --silent --show-error "${BASE}/terms" -o /tmp/teslafield-terms.html
          grep -q "Terms of Use" /tmp/teslafield-terms.html
          echo "Verified clean /terms page."
          curl --fail --location --silent --show-error "${BASE}/oauth?verify=${GITHUB_SHA}" -o /tmp/teslafield-oauth.html
          grep -q 'id="signInButton"' /tmp/teslafield-oauth.html
          grep -q '/__/firebase/init.js' /tmp/teslafield-oauth.html
          curl --fail --silent --show-error "${BASE}/oauth.js?v=$VERSION&verify=${GITHUB_SHA}" -o /tmp/teslafield-oauth.js
          grep -q '/oauth/consent' /tmp/teslafield-oauth.js
          echo "Verified Firebase-hosted OAuth sign-in and consent assets."
          curl --fail --location --silent --show-error "${BASE}/privacy" -o /tmp/teslafield-privacy.html
          grep -q "Privacy Policy" /tmp/teslafield-privacy.html
          echo "Verified clean /privacy page."
          curl --fail --location --silent --show-error "${BASE}/chatgpt-terms" -o /tmp/teslafield-chatgpt-terms.html
          grep -q "Terms of Service" /tmp/teslafield-chatgpt-terms.html
          curl --fail --location --silent --show-error "${BASE}/chatgpt-privacy" -o /tmp/teslafield-chatgpt-privacy.html
          grep -q "Privacy Policy" /tmp/teslafield-chatgpt-privacy.html
