name: Deploy TESLAFIELD to Hugging Face Spaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "huggingface/image-space/**"
      - "huggingface/video-space/**"
      - ".github/workflows/deploy-huggingface-spaces.yml"

permissions:
  contents: read

jobs:
  deploy-image:
    name: Deploy Image Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TESLAFIELD
        uses: actions/checkout@v7
      - name: Sync Image Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Earthaioa/teslafield-image
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          subdirectory: huggingface/image-space

  deploy-video:
    name: Deploy Video Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TESLAFIELD
        uses: actions/checkout@v7
      - name: Sync Video Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Earthaioa/teslafield-video
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: gradio
          subdirectory: huggingface/video-space
