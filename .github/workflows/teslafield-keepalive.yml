name: TESLAFIELD Keepalive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/teslafield-keepalive.yml"
  schedule:
    # Every 10 minutes, offset from the top of the hour to reduce schedule congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslafield-keepalive
  cancel-in-progress: true

jobs:
  keep-services-awake:
    name: Ping TESLAFIELD core services
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Render backend and core AI integrations
        shell: bash
        run: |
          set -uo pipefail
          failures=0

          ping() {
            local name="$1"
            local url="$2"
            echo "::group::$name"
            if curl --location --silent --show-error --fail \
              --connect-timeout 15 --max-time 60 \
              --retry 2 --retry-delay 5 --retry-all-errors \
              --output /dev/null "$url"; then
              echo "::notice::$name responded successfully."
            else
              echo "::warning::$name did not return a successful response. It may be starting, sleeping, or temporarily unavailable."
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }

          # Keep the Node API active and warm the public model catalogue on every page refresh cycle.
          ping "Render API health" "https://teslafield-api.onrender.com/health"
          ping "TeslafieldAI model catalogue" "https://teslafield-api.onrender.com/api/v1/models"

          # This endpoint also checks the Chat, Speech and Voice Hugging Face Spaces.
          warmup_file="$(mktemp)"
          if curl --location --silent --show-error --fail \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --output "$warmup_file" "https://teslafield-api.onrender.com/api/v1/warmup"; then
            echo "::notice::Render integration warmup responded."
            jq -r '.engines // {} | to_entries[] | "\(.key): \(.value)"' "$warmup_file"
            if ! jq -e '.engines.chat == "online" and .engines.speech == "online" and .engines.voice == "online"' "$warmup_file" >/dev/null; then
              echo "::warning::At least one Chat, Speech or Voice Space is not reported online."
              failures=$((failures + 1))
            fi
          else
            echo "::warning::Render integration warmup endpoint did not return a successful response."
            failures=$((failures + 1))
          fi
          rm -f "$warmup_file"


          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures keepalive check(s) failed. The next scheduled run will retry."
            exit 1
          else
            echo "All TESLAFIELD keepalive checks returned successful responses."
          fi
