name: Public Security Baseline (OWASP ZAP)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-baseline.yml"

permissions:
  contents: read

concurrency:
  group: teslafield-public-security-baseline
  cancel-in-progress: false

jobs:
  passive-dast:
    name: Passive unauthenticated DAST baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Scan public Firebase Hosting surface
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD/reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://teslafieldai.web.app \
            -m 2 -T 5 -I -r firebase-zap.html -J firebase-zap.json
      - name: Scan public Render API root
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD/reports:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t https://teslafield-api.onrender.com \
            -m 1 -T 5 -I -r render-api-zap.html -J render-api-zap.json
      - name: Upload passive scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teslafield-public-security-baseline
          path: reports/
          if-no-files-found: warn
          retention-days: 14
