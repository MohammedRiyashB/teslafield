name: Deploy Teslafield Chat Engine (Qwen3-0.6B)

on:
  push:
    branches: [main]
    paths:
      - "huggingface/chat-space/**"
      - ".github/workflows/deploy-teslafield-chat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teslafield-chat-engine-stable
  cancel-in-progress: false

jobs:
  deploy-chat:
    name: Validate and deploy Teslafield Qwen3-0.6B
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Teslafield
        uses: actions/checkout@v4

      - name: Validate stable Chat Engine and Docker README
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile huggingface/chat-space/app.py
          test -s huggingface/chat-space/README.md
          test -s huggingface/chat-space/Dockerfile
          test -s huggingface/chat-space/requirements.txt
          grep -q 'MODEL_ID = "Qwen/Qwen3-0.6B"' huggingface/chat-space/app.py
          grep -q 'TextIteratorStreamer' huggingface/chat-space/app.py
          ! grep -q 'llama_cpp' huggingface/chat-space/app.py
          ! grep -qi 'llama-cpp-python' huggingface/chat-space/requirements.txt
          grep -q '^title: Teslafield Chat Engine$' huggingface/chat-space/README.md
          grep -q '^emoji: ' huggingface/chat-space/README.md
          grep -q '^colorFrom: blue$' huggingface/chat-space/README.md
          grep -q '^colorTo: indigo$' huggingface/chat-space/README.md
          grep -q '^sdk: docker$' huggingface/chat-space/README.md
          grep -q '^app_port: 7860$' huggingface/chat-space/README.md
          echo "Stable Qwen3-0.6B source and Docker Space configuration validated."

      - name: Deploy only the Chat Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Earthaioa/EARTH_OS_V10_DOCKER
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker
          subdirectory: huggingface/chat-space
